<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6.25-26亚太采购峰会 - 幸运转盘</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .header {
            margin-bottom: 22px;
            color: #fff;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
        }

        .header p {
            margin-top: 8px;
            font-size: 15px;
            opacity: 0.92;
        }

        .test-badge {
            display: none;
            margin-top: 12px;
            padding: 6px 16px;
            background: #ff4757;
            color: #fff;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(255, 71, 87, 0.35);
        }

        .test-badge.show {
            display: inline-block;
        }

        .wheel-wrap {
            position: relative;
            width: min(88vw, 420px);
            height: min(88vw, 420px);
            margin: 0 auto 24px;
        }

        .wheel-shell {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 10px;
            background: linear-gradient(145deg, #ffffff, #e8e8e8);
            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.32),
                inset 0 0 20px rgba(255, 255, 255, 0.9);
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            transition: transform 4.6s cubic-bezier(0.12, 0.72, 0.18, 1);
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.16);
        }

        .pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 46px;
            height: 58px;
            filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.35));
        }

        .pointer svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .center-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 82px;
            height: 82px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: linear-gradient(145deg, #fff, #f1f1f1);
            border: 5px solid rgba(255, 255, 255, 0.9);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-size: 17px;
            font-weight: 900;
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.28),
                inset 0 0 8px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            user-select: none;
        }

        .spin-btn {
            border: none;
            outline: none;
            cursor: pointer;
            padding: 15px 58px;
            border-radius: 999px;
            background: #fff;
            color: #667eea;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
            transition: all 0.22s ease;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 36px rgba(0, 0, 0, 0.3);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .spin-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .note {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.86);
            font-size: 13px;
            line-height: 1.6;
        }

        .debug-box {
            display: none;
            margin-top: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.92);
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.6;
            text-align: left;
            word-break: break-all;
        }

        .debug-box.show {
            display: block;
        }

        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.62);
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal-mask.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 22px;
            padding: 32px 24px 26px;
            text-align: center;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
            animation: popIn 0.28s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.86);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal .icon {
            font-size: 54px;
            margin-bottom: 12px;
        }

        .modal h2 {
            color: #333;
            font-size: 25px;
            margin-bottom: 14px;
        }

        .prize-name {
            color: #667eea;
            font-size: 21px;
            line-height: 1.35;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .modal p {
            color: #666;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .modal button {
            border: none;
            outline: none;
            cursor: pointer;
            padding: 12px 34px;
            border-radius: 999px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
        }

        .toast {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%);
            z-index: 200;
            max-width: calc(100vw - 40px);
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        }

        .toast.show {
            display: block;
        }

        @media (max-width: 430px) {
            .header h1 {
                font-size: 23px;
            }

            .header p {
                font-size: 13px;
            }

            .center-btn {
                width: 70px;
                height: 70px;
                font-size: 15px;
            }

            .spin-btn {
                padding: 14px 48px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="header">
            <h1>6.25-26亚太采购峰会</h1>
            <p>幸运转盘抽奖</p>
            <div id="testBadge" class="test-badge">测试模式：不扣库存</div>
        </div>

        <div class="wheel-wrap">
            <div class="pointer">
                <svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 76 L8 12 Q30 -2 52 12 Z" fill="#ff4757"/>
                    <path d="M30 63 L17 17 Q30 8 43 17 Z" fill="#fff"/>
                    <circle cx="30" cy="18" r="7" fill="#ff4757"/>
                </svg>
            </div>

            <div class="wheel-shell">
                <canvas id="wheelCanvas" width="900" height="900"></canvas>
                <div class="center-btn">LUCKY</div>
            </div>
        </div>

        <button id="spinBtn" class="spin-btn">开始抽奖</button>

        <div class="note">
            每人限抽一次。中奖结果以系统记录为准。<br />
            测试链接请使用地址后加 <strong>?test=1</strong>
        </div>

        <div id="debugBox" class="debug-box"></div>
    </div>

    <div id="modalMask" class="modal-mask">
        <div class="modal">
            <div class="icon">🎉</div>
            <h2>恭喜中奖</h2>
            <div id="modalPrizeName" class="prize-name"></div>
            <p id="modalText">请根据现场工作人员指引领取奖品。</p>
            <button onclick="closeModal()">我知道了</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        /************************************************************
         * 基础配置
         ************************************************************/

        // 你的腾讯云 CloudBase 云函数地址
        const DRAW_API_URL = 'https://wheel-d2gqxo1o03c25766b-1447012317.ap-shanghai.app.tcloudbase.com/drawPrize';

        // 测试模式：地址带 ?test=1 时开启
        const urlParams = new URLSearchParams(window.location.search);
        const isTestMode = urlParams.get('test') === '1';

        // 是否显示调试信息
        // 小白建议测试时保持 true，正式活动前可以改成 false
        const SHOW_DEBUG = isTestMode;

        // 本地限制 key。正式模式下，当前浏览器抽过一次后就不能再抽
        const DRAWN_KEY = 'apac_purchase_summit_lottery_drawn_v2';

        // 指针固定在顶部。
        // Canvas 默认角度：0°在右边，90°在下方，180°在左边，270°在顶部。
        const POINTER_ANGLE = 270;

        // 本代码绘制转盘时用了 startAngle - 90，让第一个奖品从顶部开始。
        // 所以这里必须是 -90，不要改。
        const WHEEL_DRAW_OFFSET = -90;

        // 奖品配置。
        // name 必须尽量和后端数据库返回名称一致。
        // displayName 是转盘上显示的短名称。
        const prizes = [
            {
                name: '小风扇',
                displayName: '小风扇',
                color: '#FF6B6B',
                weight: 15
            },
            {
                name: '蓝色本子',
                displayName: '蓝色本子',
                color: '#4ECDC4',
                weight: 25
            },
            {
                name: '笔记本书签套装',
                displayName: '笔记本书签套装',
                color: '#45B7D1',
                weight: 12
            },
            {
                name: '合合杜邦纸袋',
                displayName: '合合杜邦纸袋',
                color: '#96CEB4',
                weight: 50
            },
            {
                name: '扫描全能王+名片全能王+启信宝VIP',
                displayName: 'VIP礼包',
                color: '#FFEAA7',
                weight: 245
            }
        ];

        // 如果后端返回的是短名称，也可以在这里做别名匹配
        const prizeAliases = {
            '扫描全能王VIP': '扫描全能王+名片全能王+启信宝VIP',
            '扫描全能王+名片全能王+启信宝VIP': '扫描全能王+名片全能王+启信宝VIP',
            'VIP': '扫描全能王+名片全能王+启信宝VIP',
            'VIP礼包': '扫描全能王+名片全能王+启信宝VIP'
        };

        const sectorAngle = 360 / prizes.length;

        const prizeAngles = prizes.map((p, index) => ({
            ...p,
            startAngle: index * sectorAngle,
            endAngle: (index + 1) * sectorAngle,
            sectorAngle: sectorAngle
        }));

        let currentRotation = 0;
        let isSpinning = false;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const testBadge = document.getElementById('testBadge');
        const debugBox = document.getElementById('debugBox');

        if (isTestMode) {
            testBadge.classList.add('show');
        }

        if (SHOW_DEBUG) {
            debugBox.classList.add('show');
        }

        /************************************************************
         * 工具函数
         ************************************************************/

        function degToRad(deg) {
            return deg * Math.PI / 180;
        }

        function normalizeAngle(angle) {
            return ((angle % 360) + 360) % 360;
        }

        function showToast(message, duration = 2600) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        function logDebug(...args) {
            console.log(...args);

            if (!SHOW_DEBUG) return;

            const text = args.map(item => {
                if (typeof item === 'string') return item;
                try {
                    return JSON.stringify(item, null, 2);
                } catch (e) {
                    return String(item);
                }
            }).join(' ');

            debugBox.innerHTML += `<div>${escapeHtml(text)}</div>`;
        }

        function clearDebug() {
            if (SHOW_DEBUG) {
                debugBox.innerHTML = '';
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function getFullPrizeName(name) {
            if (!name) return '';

            const cleanName = String(name).trim();

            if (prizeAliases[cleanName]) {
                return prizeAliases[cleanName];
            }

            const exact = prizes.find(p => p.name === cleanName);
            if (exact) return exact.name;

            const display = prizes.find(p => p.displayName === cleanName);
            if (display) return display.name;

            return cleanName;
        }

        function getDisplayPrizeName(fullName) {
            const prize = prizes.find(p => p.name === fullName);
            return prize ? prize.name : fullName;
        }

        /************************************************************
         * 绘制转盘
         ************************************************************/

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const cx = width / 2;
            const cy = height / 2;
            const radius = width / 2 - 18;

            ctx.clearRect(0, 0, width, height);

            prizeAngles.forEach((prize) => {
                const start = degToRad(prize.startAngle + WHEEL_DRAW_OFFSET);
                const end = degToRad(prize.endAngle + WHEEL_DRAW_OFFSET);
                const mid = degToRad(
                    prize.startAngle + prize.sectorAngle / 2 + WHEEL_DRAW_OFFSET
                );

                // 扇区
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, start, end, false);
                ctx.closePath();
                ctx.fillStyle = prize.color;
                ctx.fill();

                // 分割线
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(
                    cx + Math.cos(start) * radius,
                    cy + Math.sin(start) * radius
                );
                ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.restore();

                // 文字
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(mid);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 34px "Microsoft YaHei", Arial';
                ctx.shadowColor = 'rgba(0,0,0,0.35)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 2;

                const textRadius = radius * 0.62;
                drawPrizeText(prize.displayName, textRadius);

                ctx.restore();
            });

            // 外圈
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.95)';
            ctx.lineWidth = 10;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, radius - 12, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        function drawPrizeText(text, radius) {
            const maxLineLength = 5;
            const lines = [];

            if (text.length <= maxLineLength) {
                lines.push(text);
            } else if (text === '笔记本书签套装') {
                lines.push('笔记本');
                lines.push('书签套装');
            } else if (text === '合合杜邦纸袋') {
                lines.push('合合');
                lines.push('杜邦纸袋');
            } else {
                for (let i = 0; i < text.length; i += maxLineLength) {
                    lines.push(text.slice(i, i + maxLineLength));
                }
            }

            const lineHeight = 38;
            const startY = -(lines.length - 1) * lineHeight / 2;

            lines.forEach((line, index) => {
                ctx.fillText(line, radius, startY + index * lineHeight);
            });
        }

        /************************************************************
         * 核心：正确计算转盘旋转角度
         ************************************************************/

        function calculateRotation(prizeName) {
            const fullName = getFullPrizeName(prizeName);
            const prize = prizeAngles.find(p => p.name === fullName);

            if (!prize) {
                console.error('未找到奖品：', prizeName);
                console.error('转换后的奖品名：', fullName);
                console.error('当前前端奖品列表：', prizeAngles.map(p => p.name));
                throw new Error(`前端没有找到奖品：${prizeName}`);
            }

            // 奖品中心角
            const midAngle = prize.startAngle + prize.sectorAngle / 2;

            /*
             * 关键公式：
             *
             * 奖品最终视觉角度 =
             * 奖品中心角 + 绘制偏移 + 转盘旋转角
             *
             * 需要让奖品中心对准顶部指针：
             *
             * midAngle + WHEEL_DRAW_OFFSET + finalRotation = POINTER_ANGLE
             *
             * 所以：
             *
             * finalRotation = POINTER_ANGLE - WHEEL_DRAW_OFFSET - midAngle
             */
            const targetRotationMod = normalizeAngle(
                POINTER_ANGLE - WHEEL_DRAW_OFFSET - midAngle
            );

            const currentMod = normalizeAngle(currentRotation);

            let delta = normalizeAngle(targetRotationMod - currentMod);

            // 防止刚好已经在目标角度时不转
            if (delta < 0.001) {
                delta += 360;
            }

            // 多转几圈，视觉效果更自然
            const extraSpins = 5 + Math.floor(Math.random() * 3);

            const finalRotation = currentRotation + extraSpins * 360 + delta;

            return finalRotation;
        }

        // 验证最终指针实际指向哪个奖品
        function getPrizeAtPointer(rotation) {
            const rotationMod = normalizeAngle(rotation);

            const logicalAngleAtPointer = normalizeAngle(
                POINTER_ANGLE - WHEEL_DRAW_OFFSET - rotationMod
            );

            const prize = prizeAngles.find(p => {
                return logicalAngleAtPointer >= p.startAngle &&
                    logicalAngleAtPointer < p.endAngle;
            });

            return {
                angle: Number(logicalAngleAtPointer.toFixed(3)),
                prizeName: prize ? prize.name : null
            };
        }

        /************************************************************
         * 后端抽奖
         ************************************************************/

        async function requestDrawFromBackend() {
            const response = await fetch(DRAW_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    test: isTestMode,
                    testMode: isTestMode,
                    mode: isTestMode ? 'test' : 'production',
                    timestamp: Date.now()
                })
            });

            let data;

            try {
                data = await response.json();
            } catch (e) {
                throw new Error('后端返回内容不是 JSON，请检查云函数返回格式');
            }

            logDebug('后端原始返回：', data);

            if (!response.ok) {
                throw new Error(data.message || data.error || `请求失败：${response.status}`);
            }

            const payload = data.data || data.result || data;

            if (payload.success === false) {
                throw new Error(payload.message || payload.error || '抽奖失败');
            }

            const rawPrizeName =
                payload.prizeName ||
                payload.prize ||
                payload.name ||
                payload.award ||
                payload.awardName ||
                payload.data?.prizeName ||
                payload.data?.prize ||
                payload.data?.name;

            if (!rawPrizeName) {
                throw new Error('后端没有返回奖品名称，请检查云函数返回字段');
            }

            return getFullPrizeName(rawPrizeName);
        }

        /************************************************************
         * 如果你需要纯前端测试，可以用这个备用函数
         * 默认不会使用。只有地址带 ?local=1 才会用。
         ************************************************************/

        function localWeightedDraw() {
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.random() * totalWeight;

            for (const prize of prizes) {
                random -= prize.weight;
                if (random <= 0) {
                    return prize.name;
                }
            }

            return prizes[prizes.length - 1].name;
        }

        /************************************************************
         * 抽奖流程
         ************************************************************/

        async function startDraw() {
            if (isSpinning) return;

            if (!isTestMode && localStorage.getItem(DRAWN_KEY) === '1') {
                showToast('您已经抽过奖了，每人限抽一次。');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.textContent = '抽奖中';

            clearDebug();

            try {
                let winningPrizeName;

                // 如果 URL 带 ?local=1，则不调用后端，只用于本地调试画面
                // 正常测试请用 ?test=1，不要加 local=1
                if (urlParams.get('local') === '1') {
                    winningPrizeName = localWeightedDraw();
                    logDebug('本地模拟中奖：', winningPrizeName);
                } else {
                    winningPrizeName = await requestDrawFromBackend();
                }

                const finalRotation = calculateRotation(winningPrizeName);
                const pointerResult = getPrizeAtPointer(finalRotation);

                logDebug('中奖奖品：', winningPrizeName);
                logDebug('最终旋转角度：', finalRotation);
                logDebug('指针最终指向：', pointerResult);

                if (pointerResult.prizeName !== winningPrizeName) {
                    console.error('角度校验失败：弹窗奖品和指针指向不一致');
                    console.error('中奖奖品：', winningPrizeName);
                    console.error('指针指向：', pointerResult.prizeName);
                }

                canvas.style.transform = `rotate(${finalRotation}deg)`;
                currentRotation = finalRotation;

                setTimeout(() => {
                    if (!isTestMode) {
                        localStorage.setItem(DRAWN_KEY, '1');
                    }

                    showPrizeModal(winningPrizeName);

                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.textContent = isTestMode ? '再次测试' : '开始抽奖';
                }, 4700);

            } catch (error) {
                console.error(error);
                logDebug('错误：', error.message);

                showToast(error.message || '抽奖失败，请稍后重试');

                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = isTestMode ? '再次测试' : '开始抽奖';
            }
        }

        /************************************************************
         * 弹窗
         ************************************************************/

        function showPrizeModal(prizeName) {
            const modalMask = document.getElementById('modalMask');
            const modalPrizeName = document.getElementById('modalPrizeName');
            const modalText = document.getElementById('modalText');

            modalPrizeName.textContent = getDisplayPrizeName(prizeName);

            if (isTestMode) {
                modalText.textContent = '当前为测试模式，本次结果不会扣减库存。';
            } else {
                modalText.textContent = '请根据现场工作人员指引领取奖品。';
            }

            modalMask.classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalMask').classList.remove('show');
        }

        /************************************************************
         * 初始化
         ************************************************************/

        function init() {
            drawWheel();

            spinBtn.addEventListener('click', startDraw);

            if (isTestMode) {
                spinBtn.textContent = '开始测试';
            }

            if (!isTestMode && localStorage.getItem(DRAWN_KEY) === '1') {
                spinBtn.textContent = '已抽奖';
            }

            logDebug('页面模式：', isTestMode ? '测试模式' : '正式模式');
            logDebug('奖品角度配置：', prizeAngles.map(p => ({
                name: p.name,
                start: p.startAngle,
                end: p.endAngle,
                mid: p.startAngle + p.sectorAngle / 2
            })));
        }

        init();
    </script>
</body>
</html>
